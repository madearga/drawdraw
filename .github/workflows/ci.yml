name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Unit tests
        run: python3 -m unittest discover skills/sketsa/tests
      - name: Adapter syntax
        run: node --check skills/sketsa/scripts/generate.mjs
      - name: Scripts compile
        run: |
          for f in skills/sketsa/scripts/*.py; do python3 -m py_compile "$f"; done
